<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>ibis &amp; ibis Styles in Francia</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Mappa degli hotel ibis e ibis Styles in Francia, con dati su popolazione, storia e cosa visitare per ogni citta'.">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>ibis <span>&amp;</span> ibis Styles <span class="fr">— Francia</span></h1>
  <div id="stats" class="stats">Caricamento dati…</div>
</header>

<nav class="view-tabs" id="view-tabs" aria-label="Vista">
  <button type="button" data-view="list" class="active" aria-pressed="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
    Elenco
  </button>
  <button type="button" data-view="map" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-6-3V4l6 3 6-3 6 3v13l-6-3-6 3zM9 7v13M15 4v13"/></svg>
    Mappa
  </button>
</nav>

<main class="layout" id="layout" data-view="list">
  <aside class="sidebar">
    <div class="controls">
      <div class="search-field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" type="search" placeholder="Cerca citta'…" autocomplete="off">
      </div>
      <div class="control-row">
        <label for="sort">Ordina per</label>
        <select id="sort">
          <option value="population-desc">Popolazione ↓</option>
          <option value="population-asc">Popolazione ↑</option>
          <option value="name-asc">Nome A→Z</option>
          <option value="hotels-desc">N. hotel ↓</option>
        </select>
      </div>
      <div class="control-row">
        <label for="minpop">Popolazione minima</label>
        <input id="minpop" type="number" min="0" step="1000" placeholder="0">
      </div>
    </div>
    <div id="list-meta" class="list-meta"></div>
    <ul id="city-list" class="city-list" aria-label="Elenco citta'"></ul>
  </aside>

  <div class="map-pane">
    <div id="map"></div>
  </div>

  <div id="detail-backdrop" class="detail-backdrop" hidden></div>
  <section id="detail" class="detail" hidden>
    <button id="detail-close" class="detail-close" aria-label="Chiudi">&times;</button>
    <div id="detail-content"></div>
  </section>
</main>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
