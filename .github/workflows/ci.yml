name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements-dev.txt

      # Solo le regole "essenziali" di pyflakes (errori di sintassi, nomi
      # non definiti, import inutilizzati): niente enforcement di stile/
      # formattazione, per non richiedere un riformattazione di massa del
      # codice esistente solo per abilitare un controllo di base.
      - name: Lint (ruff, regole essenziali)
        run: ruff check --select=E9,F scripts/

      - name: Test
        run: pytest -q
