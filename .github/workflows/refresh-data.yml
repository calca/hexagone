name: Refresh dataset (Overpass/Wikidata/Wikipedia)

on:
  schedule:
    - cron: "0 3 * * 1" # ogni lunedi' alle 03:00 UTC
  workflow_dispatch:
    inputs:
      skip_wikimedia:
        description: "Salta storia/attrazioni (giro rapido, solo hotel+popolazione)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Ceiling esplicito: se qualcosa si blocca, il job fallisce in modo
    # visibile invece di consumare in silenzio le 6h di default di GitHub
    # Actions (come successo il 12/08/2026).
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Configura git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # La pipeline e' eseguita uno step alla volta (invece che come unico
      # comando) e ogni step che produce una cache resumibile viene committato
      # subito dopo: se una run successiva viene interrotta (timeout, crash),
      # la prossima riparte dal progresso gia' salvato invece che da zero.
      - name: "Step: hotel"
        run: python scripts/pipeline.py --only hotels

      - name: "Step: citta' (raggruppamento + geocodifica per-hotel)"
        timeout-minutes: 35
        run: python scripts/pipeline.py --only cities

      - name: "Commit: cache geocodifica"
        run: |
          git add data/cache/geo_lookup_cache.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica alla cache di geocodifica."
          else
            git commit -m "chore: aggiorna cache geocodifica hotel (refresh dataset)"
            git push origin main
          fi

      - name: "Step: indirizzi (reverse geocoding BAN per gli hotel senza addr:street)"
        timeout-minutes: 20
        run: python scripts/pipeline.py --only addresses

      - name: "Commit: cache indirizzi"
        run: |
          git add data/cache/address_cache.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica alla cache indirizzi."
          else
            git commit -m "chore: aggiorna cache indirizzi hotel (refresh dataset)"
            git push origin main
          fi

      - name: "Step: wikidata (popolazione)"
        run: python scripts/pipeline.py --only wikidata

      # Siti UNESCO: lista statica locale, nessuna chiamata di rete.
      - name: "Step: siti UNESCO"
        run: python scripts/pipeline.py --only unesco

      # Monumenti storici via Wikidata SPARQL (query.wikidata.org, lo stesso
      # endpoint dello step "wikidata" sopra) invece dell'API del Ministero
      # della Cultura (data.culture.gouv.fr, abbandonata dopo tre tentativi
      # falliti - vedi la history di scripts/enrich_unesco.py).
      - name: "Step: monumenti storici (Wikidata)"
        timeout-minutes: 20
        run: python scripts/pipeline.py --only monuments

      - name: "Step: wikimedia (storia/attrazioni)"
        if: ${{ github.event.inputs.skip_wikimedia != 'true' }}
        timeout-minutes: 30
        run: python scripts/pipeline.py --only wikimedia

      - name: "Commit: cache Wikipedia/Wikivoyage"
        if: ${{ github.event.inputs.skip_wikimedia != 'true' }}
        run: |
          git add data/cache/wiki_cache.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica alla cache wiki."
          else
            git commit -m "chore: aggiorna cache storia/attrazioni (refresh dataset)"
            git push origin main
          fi

      - name: "Step: build dataset finale"
        run: python scripts/pipeline.py --only build

      - name: "Commit: dataset aggiornato"
        run: |
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica al dataset."
          else
            git commit -m "chore: refresh dataset ibis/ibis Styles Francia"
            git push origin main
          fi
